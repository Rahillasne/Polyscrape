name: Refresh deadlines

# Scrapes every source, runs the data-quality gate, and commits src/data/deadlines.json
# only when it actually changes. Gemini Flash is the only paid call and runs solely here,
# on changed pages only (sha256 cache), so cost stays at ~$0/month.

on:
  schedule:
    - cron: "17 6 * * *" # daily at 06:17 UTC
  workflow_dispatch: {} # allow manual runs from the Actions tab

permissions:
  contents: write # needed to commit the refreshed dataset

concurrency:
  group: refresh-deadlines
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Run pipeline (scrape -> validate -> merge)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m pipeline.run

      - name: Commit dataset if changed
        run: |
          if [[ -n "$(git status --porcelain src/data/deadlines.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/data/deadlines.json
            git commit -m "chore(data): refresh deadlines [skip ci]"
            git push
          else
            echo "No changes to deadlines.json — nothing to commit."
          fi
